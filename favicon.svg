<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20"/>
      <stop offset="50%" stop-color="#18113C"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#312E81" stroke-width="2"/>
  <!-- Phone outline preview -->
  <rect x="24" y="16" width="80" height="96" rx="16" fill="none" stroke="#4C1D95" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- Glowing notch / cutout halo -->
  <circle cx="64" cy="38" r="16" fill="url(#ringGrad)" filter="url(#glow)" opacity="0.85"/>
  <!-- Camera lens center -->
  <circle cx="64" cy="38" r="8" fill="#000000" stroke="#06B6D4" stroke-width="1.5"/>
  <circle cx="66" cy="36" r="2" fill="#FFFFFF" opacity="0.8"/>
  <!-- Bottom Accent Wave -->
  <path d="M 32 94 Q 64 78 96 94" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>
